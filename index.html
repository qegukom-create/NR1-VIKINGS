<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NR1 - Vikings War Room</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 15px; text-align: center; }
        .container { max-width: 850px; margin: auto; background: #16213e; padding: 20px; border-radius: 12px; border: 1px solid #e94560; box-shadow: 0 0 20px rgba(233,69,96,0.3); }
        h1 { color: #e94560; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 2px; }
        
        .panel { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; }
        input, select { background: #1a1a2e; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 4px; margin: 5px; font-size: 14px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn-host { background: #e94560; color: white; }
        .btn-send { background: #4ecc71; color: white; width: 120px; }
        
        .suggest-btn { background: #1a1a2e; border: 1px solid #4ecc71; color: #4ecc71; font-size: 0.75em; padding: 5px 10px; margin: 2px; border-radius: 3px; cursor: pointer; }

        .host-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .host-card { background: #1a1a2e; border: 2px solid #e94560; border-radius: 8px; padding: 15px; text-align: left; position: relative; }
        
        .status-badge { font-size: 0.7em; padding: 3px 8px; border-radius: 10px; font-weight: bold; float: right; text-transform: uppercase; margin-left: 5px;}
        .status-urgent { background: #ff4d4d; color: white; animation: pulse 1.5s infinite; }
        .status-stable { background: #4ecc71; color: #1a1a2e; }
        
        .delete-btn { color: #ff4d4d; cursor: pointer; font-weight: bold; margin-left: 10px; border: none; background: none; font-size: 1.2em; vertical-align: middle; }
        .delete-btn:hover { color: #fff; }

        .progress-bg { background: #333; height: 18px; border-radius: 9px; overflow: hidden; margin: 10px 0; border: 1px solid #555; }
        .progress-fill { height: 100%; transition: width 0.5s; width: 0%; }
        
        .reinforcer-list { font-size: 0.85em; color: #95adbe; list-style: none; padding: 0; max-height: 120px; overflow-y: auto; margin-top: 10px; border-top: 1px solid #333; padding-top: 5px; }
        .reinforcer-item { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
        .remove-reinf { color: #aaa; cursor: pointer; font-size: 0.8em; padding: 0 5px; }
        .remove-reinf:hover { color: #ff4d4d; }

        .btn-reset { background: #444; color: #aaa; margin-top: 40px; font-size: 0.7em; cursor: pointer; border: none; padding: 5px 10px; border-radius: 4px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡 NR1 VIKINGS WAR ROOM</h1>

    <div class="panel">
        <strong>🏰 BECOME A TARGET (HOST)</strong><br>
        <input type="text" id="h-name" placeholder="In-Game Name">
        <input type="number" id="h-capa" placeholder="Garrison Capacity">
        <button class="btn btn-host" onclick="addHost()">I will be online</button>
    </div>

    <div class="panel">
        <strong>🏹 SEND BALANCED REINFORCEMENTS</strong><br>
        <input type="text" id="r-name" placeholder="Your Name">
        <input type="number" id="r-qty" placeholder="Troops Amount">
        <div id="suggest-ui" style="margin: 5px 0;">
            <button class="suggest-btn" onclick="applySuggest(0.25)">25%</button>
            <button class="suggest-btn" onclick="applySuggest(0.50)">50%</button>
            <button class="suggest-btn" onclick="applySuggest(1.00)">Fill All</button>
        </div>
        <select id="r-target" onchange="syncSelectedSpace()"><option value="">Select Host...</option></select>
        <button class="btn btn-send" onclick="sendReinforce()">Send</button>
    </div>

    <div id="host-display" class="host-grid"></div>

    <button class="btn btn-reset" onclick="resetAll()">Full Reset (Admin)</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA8edMWQreJMKrbS8MuowKZl58x7W5vfBU",
        authDomain: "nr1-vikings.firebaseapp.com",
        databaseURL: "https://nr1-vikings-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "nr1-vikings",
        storageBucket: "nr1-vikings.firebasestorage.app",
        messagingSenderId: "1042283854890",
        appId: "1:1042283854890:web:84414b7afed626191ed753"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const hostsRef = db.ref('viking_strategy');

    let localSpaceCache = {};

    hostsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const display = document.getElementById('host-display');
        const select = document.getElementById('r-target');
        const selectedValue = select.value;
        
        display.innerHTML = "";
        select.innerHTML = '<option value="">Select Host...</option>';
        localSpaceCache = {};
        
        if (data) {
            Object.keys(data).forEach(id => {
                const h = data[id];
                let total = 0;
                let rHTML = "";
                
                if (h.reinforcements) {
                    Object.keys(h.reinforcements).forEach(reinfId => {
                        const r = h.reinforcements[reinfId];
                        total += parseInt(r.qty);
                        rHTML += `<li class="reinforcer-item">
                                    <span>• ${r.name} (+${r.qty.toLocaleString()})</span>
                                    <span class="remove-reinf" onclick="removeReinforcement('${id}', '${reinfId}')">✖</span>
                                  </li>`;
                    });
                }

                let left = h.capacity - total;
                let percent = (total / h.capacity) * 100;
                localSpaceCache[id] = left;

                let statusClass = percent < 50 ? "status-urgent" : "status-stable";
                let statusText = percent < 50 ? "Urgent Help" : "Stable";
                if (total >= h.capacity) { statusClass = ""; statusText = "FULL"; }

                if (total < h.capacity) {
                    let opt = document.createElement("option");
                    opt.value = id;
                    opt.text = `${h.name} (${left.toLocaleString()} left)`;
                    select.add(opt);
                }

                display.innerHTML += `
                    <div class="host-card">
                        <button class="delete-btn" style="float:right" onclick="removeHost('${id}')" title="Remove Host">×</button>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        <span style="color:#e94560; font-weight:bold; font-size:1.1em;">🏰 ${h.name}</span>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width:${percent}%; background:${percent < 50 ? '#ff4d4d' : '#4ecc71'}"></div>
                        </div>
                        <div style="text-align:right; font-size:0.8em; font-weight:bold;">
                            ${total.toLocaleString()} / ${h.capacity.toLocaleString()} (${percent.toFixed(0)}%)
                        </div>
                        <ul class="reinforcer-list">
                            <li style="color:#e94560; font-weight:bold; margin-bottom:3px; font-size:0.9em;">Reinforcements:</li>
                            ${rHTML || '<li>Waiting...</li>'}
                        </ul>
                    </div>
                `;
            });
            select.value = selectedValue;
        }
    });

    function applySuggest(ratio) {
        const id = document.getElementById('r-target').value;
        if (!id) return alert("Select a Host!");
        document.getElementById('r-qty').value = Math.floor(localSpaceCache[id] * ratio);
    }

    function addHost() {
        const name = document.getElementById('h-name').value.trim();
        const capa = document.getElementById('h-capa').value;
        if (!name || !capa) return alert("Fill Name and Capacity!");
        hostsRef.push({ name: name, capacity: parseInt(capa), reinforcements: {} });
        document.getElementById('h-name').value = "";
    }

    function removeHost(id) {
        if (prompt("Admin Password to remove Host:") === "NR1") {
            hostsRef.child(id).remove();
        }
    }

    function removeReinforcement(hostId, reinfId) {
        if (confirm("Cancel this reinforcement?")) {
            hostsRef.child(hostId).child('reinforcements').child(reinfId).remove();
        }
    }

    function sendReinforce() {
        const name = document.getElementById('r-name').value.trim();
        const qty = parseInt(document.getElementById('r-qty').value);
        const targetId = document.getElementById('r-target').value;
        if (!name || isNaN(qty) || !targetId) return alert("Fill all fields!");

        if (qty > localSpaceCache[targetId]) return alert("Not enough space!");

        hostsRef.child(targetId).child('reinforcements').push({ name: name, qty: qty });
        document.getElementById('r-qty').value = "";
    }

    function resetAll() {
        if (prompt("Admin Password:") === "NR1") hostsRef.remove();
    }
</script>
</body>
</html>
