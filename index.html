<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NR1 - Vikings War Room</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 15px; text-align: center; }
        .container { max-width: 800px; margin: auto; background: #16213e; padding: 20px; border-radius: 12px; border: 1px solid #e94560; box-shadow: 0 0 20px rgba(233,69,96,0.3); }
        h1 { color: #e94560; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 2px; }
        
        .panel { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; }
        input, select { background: #1a1a2e; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 4px; margin: 5px; font-size: 14px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn-host { background: #e94560; color: white; }
        .btn-send { background: #4ecc71; color: white; }
        
        .host-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .host-card { background: #1a1a2e; border: 2px solid #e94560; border-radius: 8px; padding: 15px; text-align: left; position: relative; }
        .host-name { font-size: 1.2em; font-weight: bold; color: #e94560; display: block; margin-bottom: 10px; }
        
        .progress-bg { background: #333; height: 20px; border-radius: 10px; overflow: hidden; margin: 10px 0; border: 1px solid #555; }
        .progress-fill { background: linear-gradient(90deg, #4ecc71, #f1c40f, #e94560); height: 100%; transition: width 0.5s; width: 0%; }
        
        .full-status { color: #ff4d4d; font-weight: bold; font-size: 0.9em; text-align: center; display: block; margin-top: 5px; }
        .reinforcer-list { font-size: 0.85em; color: #95adbe; list-style: none; padding: 0; max-height: 120px; overflow-y: auto; margin-top: 10px; border-top: 1px solid #333; padding-top: 5px; }
        .btn-reset { background: #444; color: #aaa; margin-top: 40px; font-size: 0.7em; cursor: pointer; border: none; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡 NR1 VIKINGS WAR ROOM</h1>

    <div class="panel">
        <strong>🏰 BECOME A TARGET (HOST)</strong><br>
        <input type="text" id="h-name" placeholder="In-Game Name">
        <input type="number" id="h-capa" placeholder="Garrison Capacity">
        <button class="btn btn-host" onclick="addHost()">I will be online</button>
    </div>

    <div class="panel">
        <strong>🏹 SEND REINFORCEMENTS</strong><br>
        <input type="text" id="r-name" placeholder="Your Name">
        <input type="number" id="r-qty" placeholder="Troops Amount">
        <span> to </span>
        <select id="r-target"><option value="">Select Host...</option></select>
        <button class="btn btn-send" onclick="sendReinforce()">Send</button>
    </div>

    <div id="host-display" class="host-grid"></div>

    <button class="btn btn-reset" onclick="resetAll()">Reset Event (Admin Only)</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA8edMWQreJMKrbS8MuowKZl58x7W5vfBU",
        authDomain: "nr1-vikings.firebaseapp.com",
        databaseURL: "https://nr1-vikings-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "nr1-vikings",
        storageBucket: "nr1-vikings.firebasestorage.app",
        messagingSenderId: "1042283854890",
        appId: "1:1042283854890:web:84414b7afed626191ed753"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const hostsRef = db.ref('viking_strategy');

    hostsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const display = document.getElementById('host-display');
        const select = document.getElementById('r-target');
        
        display.innerHTML = "";
        select.innerHTML = '<option value="">Select Host...</option>';
        
        if (data) {
            Object.keys(data).forEach(id => {
                const h = data[id];
                let totalReceived = 0;
                let reinforcersHTML = "";
                
                if (h.reinforcements) {
                    Object.values(h.reinforcements).forEach(r => {
                        totalReceived += parseInt(r.qty);
                        reinforcersHTML += `<li>• ${r.name} (+${r.qty.toLocaleString()})</li>`;
                    });
                }

                let isFull = totalReceived >= h.capacity;
                let percent = Math.min((totalReceived / h.capacity) * 100, 100).toFixed(0);
                
                // --- CONDITION : ON N'AJOUTE AU SELECTEUR QUE S'IL N'EST PAS PLEIN ---
                if (!isFull) {
                    select.innerHTML += `<option value="${id}">${h.name} (${(h.capacity - totalReceived).toLocaleString()} left)</option>`;
                }
                
                display.innerHTML += `
                    <div class="host-card" style="${isFull ? 'border-color: #555; opacity: 0.8;' : ''}">
                        <span class="host-name">🏰 ${h.name} ${isFull ? ' (FULL)' : ''}</span>
                        <small style="color:#95adbe">Max Capacity: ${h.capacity.toLocaleString()}</small>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${percent}%; background: ${isFull ? '#555' : ''}"></div>
                        </div>
                        <div style="text-align:right; font-size:0.85em; font-weight:bold;">
                            ${totalReceived.toLocaleString()} / ${h.capacity.toLocaleString()} (${percent}%)
                        </div>
                        ${isFull ? '<span class="full-status">⛔ NO MORE SPACE</span>' : ''}
                        <ul class="reinforcer-list">
                            <li style="color:#e94560; font-weight:bold; margin-bottom:5px;">Reinforcements:</li>
                            ${reinforcersHTML || '<li>No troops yet</li>'}
                        </ul>
                    </div>
                `;
            });
        }
    });

    function addHost() {
        const name = document.getElementById('h-name').value.trim();
        const capa = document.getElementById('h-capa').value;
        if (!name || !capa) return alert("Enter Name and Capacity!");
        hostsRef.push({ name: name, capacity: parseInt(capa), reinforcements: {} });
        document.getElementById('h-name').value = "";
        document.getElementById('h-capa').value = "";
    }

    function sendReinforce() {
        const name = document.getElementById('r-name').value.trim();
        const qty = parseInt(document.getElementById('r-qty').value);
        const targetId = document.getElementById('r-target').value;
        if (!name || !qty || !targetId) return alert("Fill all fields!");

        hostsRef.child(targetId).once('value', (snapshot) => {
            const h = snapshot.val();
            let current = 0;
            if (h.reinforcements) Object.values(h.reinforcements).forEach(r => current += parseInt(r.qty));
            
            if (qty > (h.capacity - current)) {
                alert("❌ Not enough space left!");
            } else {
                hostsRef.child(targetId).child('reinforcements').push({ name: name, qty: qty });
                document.getElementById('r-qty').value = "";
            }
        });
    }

    function resetAll() {
        if (prompt("Admin Password:") === "NR1") hostsRef.remove();
    }
</script>
</body>
</html>
