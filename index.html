<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NR1 - Vikings Auto-Balancer</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root { --bg: #111827; --card: #1f2937; --accent: #10b981; --primary: #3b82f6; --danger: #ef4444; --text: #f3f4f6; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; position: relative; }
        
        /* BOUTON CONFIG SQUAD */
        .btn-config { 
            position: absolute; top: 0; right: 0; 
            background: rgba(59, 130, 246, 0.1); border: 1px solid var(--primary); 
            color: var(--primary); padding: 6px 12px; border-radius: 6px; 
            font-size: 0.75rem; text-decoration: none; font-weight: bold;
            transition: 0.3s;
        }
        .btn-config:hover { background: var(--primary); color: white; }

        h1 { font-size: 1.5rem; text-align: center; color: var(--primary); margin: 20px 0 10px 0; font-weight: 800; letter-spacing: 1px; }
        .panel { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        label { font-size: 0.75rem; font-weight: bold; color: #9ca3af; display: block; margin-bottom: 5px; text-transform: uppercase; }
        input { background: #111827; border: 1px solid #374151; color: white; padding: 12px; width: 100%; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-host { background: var(--primary); color: white; margin-bottom: 5px; }
        .btn-send { background: var(--accent); color: white; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }

        .host-card { background: var(--card); border-radius: 12px; padding: 15px; margin-top: 10px; border-left: 6px solid var(--primary); }
        .host-header { display: flex; justify-content: space-between; align-items: center; }
        .host-name { font-weight: 800; font-size: 1.1rem; }
        
        .progress-bar { background: #374151; height: 12px; border-radius: 6px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.5s; background: var(--accent); }
        .full { background: var(--danger) !important; }

        .reinf-list { font-size: 0.85rem; list-style: none; padding: 0; margin: 5px 0 0 0; color: #d1d5db; }
        .reinf-item { background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; margin-top: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        .del-btn { color: #6b7280; font-size: 1.5rem; background: none; border: none; cursor: pointer; line-height: 1; }
        
        /* MODAL STYLE */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #374151; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: var(--primary); }
        .modal-text { color: #f3f4f6; margin-bottom: 20px; font-size: 0.95rem; text-align: left; background: #111827; padding: 15px; border-radius: 8px; line-height: 1.5; }
        .modal-buttons { display: flex; gap: 10px; }
        .btn-ok { background: var(--primary); color: white; flex: 1; }
        .btn-cancel { background: #4b5563; color: white; flex: 1; }
        .btn-confirm { background: var(--danger); color: white; flex: 1; }

        .reset-all { background: none; border: none; color: #4b5563; width: 100%; margin-top: 30px; font-size: 0.75rem; text-decoration: underline; cursor: pointer; }
        .order-item { border-bottom: 1px solid #374151; padding: 5px 0; display: block; }
        .order-item:last-child { border: none; }
    </style>
</head>
<body>

<div class="container">
    <a href="https://qegukom-create.github.io/NR1-PLANNER/" class="btn-config">Config Squad ⚙️</a>
    
    <h1>NR1 🛡 VIKINGS</h1>

    <div class="panel">
        <label>BECOME HOST (400k Cap)</label>
        <input type="text" id="h-name" placeholder="In-Game Name">
        <button class="btn btn-host" onclick="addHost()">I am Online</button>
    </div>

    <div class="panel">
        <label>REINFORCEMENTS (Auto-Split)</label>
        <input type="text" id="r-name" placeholder="Your Name">
        <input type="number" id="r-qty" placeholder="Total Troops to dispatch">
        <button class="btn btn-send" onclick="handleAutoBalance()">Dispatch Troops</button>
    </div>

    <div id="display"></div>

    <button class="reset-all" onclick="showConfirmModal('Full Reset', 'This will wipe the entire board. Are you sure?', () => hostsRef.remove())">System Reset</button>
</div>

<div id="customModal" class="modal-overlay">
    <div class="modal-content">
        <div id="modalTitle" class="modal-title">Info</div>
        <div id="modalText" class="modal-text"></div>
        <div id="modalButtons" class="modal-buttons"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA8edMWQreJMKrbS8MuowKZl58x7W5vfBU",
        authDomain: "nr1-vikings.firebaseapp.com",
        databaseURL: "https://nr1-vikings-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "nr1-vikings",
        storageBucket: "nr1-vikings.firebasestorage.app",
        messagingSenderId: "1042283854890",
        appId: "1:1042283854890:web:84414b7afed626191ed753"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const hostsRef = db.ref('viking_strategy');
    const MAX_CAP = 400000;
    const SLICE = 100000;

    // MODAL UTILS
    function showConfirmModal(title, text, action) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalText').innerText = text;
        const btnContainer = document.getElementById('modalButtons');
        btnContainer.innerHTML = `
            <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn btn-confirm" id="confirmBtn">Confirm</button>
        `;
        document.getElementById('confirmBtn').onclick = () => { action(); closeModal(); };
        document.getElementById('customModal').style.display = 'flex';
    }

    function showOrderModal(orders) {
        document.getElementById('modalTitle').innerText = "🚀 DISPATCH ORDERS";
        let html = "<strong>Your troops are assigned! Please send:</strong><br><br>";
        orders.forEach(o => {
            html += `<span class="order-item">➡️ <b>${(o.qty/1000)}k</b> to 🏰 <b>${o.hostName}</b></span>`;
        });
        document.getElementById('modalText').innerHTML = html;
        document.getElementById('modalButtons').innerHTML = `<button class="btn btn-ok" onclick="closeModal()">Got it!</button>`;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('customModal').style.display = 'none'; }

    hostsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const display = document.getElementById('display');
        display.innerHTML = "";
        if (!data) return;

        Object.keys(data).forEach(id => {
            const h = data[id];
            let total = 0;
            let list = "";
            if (h.reinforcements) {
                Object.keys(h.reinforcements).forEach(rid => {
                    const r = h.reinforcements[rid];
                    total += r.qty;
                    list += `<div class="reinf-item">
                                <span>${r.name}</span> 
                                <span>+${(r.qty/1000)}k <button style="color:var(--danger); border:none; background:none; cursor:pointer;" onclick="hostsRef.child('${id}').child('reinforcements').child('${rid}').remove()">×</button></span>
                             </div>`;
                });
            }
            const pct = (total / MAX_CAP) * 100;
            display.innerHTML += `
                <div class="host-card">
                    <div class="host-header">
                        <span class="host-name">🏰 ${h.name}</span>
                        <button class="del-btn" onclick="showConfirmModal('Remove Host', 'Remove ${h.name}?', () => hostsRef.child('${id}').remove())">×</button>
                    </div>
                    <div class="progress-bar"><div class="progress-fill ${pct >= 100 ? 'full' : ''}" style="width:${Math.min(pct, 100)}%"></div></div>
                    <div style="font-size:0.8rem; text-align:right; font-weight:bold; color:${pct >= 100 ? 'var(--danger)' : '#9ca3af'}">
                        ${total.toLocaleString()} / ${MAX_CAP.toLocaleString()}
                    </div>
                    <div class="reinf-list">${list}</div>
                </div>`;
        });
    });

    function addHost() {
        const nameInput = document.getElementById('h-name');
        if (nameInput.value.trim()) { 
            hostsRef.push({ name: nameInput.value.trim(), capacity: MAX_CAP }); 
            nameInput.value = ""; 
        }
    }

    async function handleAutoBalance() {
        const name = document.getElementById('r-name').value.trim();
        let qty = parseInt(document.getElementById('r-qty').value);
        if (!name || isNaN(qty) || qty <= 0) return;

        const snapshot = await hostsRef.once('value');
        const hosts = snapshot.val();
        if (!hosts) return;

        let hostArray = Object.keys(hosts).map(id => {
            let total = 0;
            if (hosts[id].reinforcements) Object.values(hosts[id].reinforcements).forEach(r => total += r.qty);
            return { id: id, name: hosts[id].name, total: total };
        });

        let myOrders = [];

        while (qty > 0) {
            hostArray.sort((a, b) => a.total - b.total);
            let target = hostArray[0];
            if (target.total >= MAX_CAP) break;
            let toSend = Math.min(qty, SLICE, MAX_CAP - target.total);
            hostsRef.child(target.id).child('reinforcements').push({ name: name, qty: toSend });
            myOrders.push({ hostName: target.name, qty: toSend });
            target.total += toSend;
            qty -= toSend;
        }

        if (myOrders.length > 0) {
            showOrderModal(myOrders);
            document.getElementById('r-qty').value = "";
        }
    }
</script>
</body>
</html>
