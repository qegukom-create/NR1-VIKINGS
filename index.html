<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NR1 - Vikings Auto-Balancer (Proximity)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root { --bg: #111827; --card: #1f2937; --accent: #10b981; --primary: #3b82f6; --danger: #ef4444; --text: #f3f4f6; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; }
        
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 5px 0; }
        .header-nav h1 { font-size: 1.3rem; color: var(--primary); margin: 0; font-weight: 800; letter-spacing: 1px; }
        .btn-config { background: rgba(59, 130, 246, 0.1); border: 1px solid var(--primary); color: var(--primary); padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; text-decoration: none; font-weight: bold; white-space: nowrap; transition: 0.3s; }

        .panel { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        label { font-size: 0.75rem; font-weight: bold; color: #9ca3af; display: block; margin-bottom: 5px; text-transform: uppercase; }
        input, select { background: #111827; border: 1px solid #374151; color: white; padding: 12px; width: 100%; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; outline: none; }
        select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 20px; }
        
        .search-dynamic { background: #0f172a; border-color: #4b5563; }
        .search-dynamic:focus { border-color: var(--primary); }

        .row { display: flex; gap: 10px; }
        .row .flex-input { flex: 2; }
        .row .flex-select { flex: 1; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-host { background: var(--primary); color: white; margin-bottom: 5px; }
        .btn-send { background: var(--accent); color: white; }
        .btn-forced { background: #d97706; color: white; margin-top: 20px; font-size: 0.85rem; } /* Style pour le nouveau bouton */

        .host-card { background: var(--card); border-radius: 12px; padding: 15px; margin-top: 10px; border-left: 6px solid var(--primary); }
        .host-header { display: flex; justify-content: space-between; align-items: center; }
        .host-name { font-weight: 800; font-size: 1.1rem; }
        .host-coords { font-size: 0.75rem; color: #9ca3af; margin-left: 8px; font-weight: normal; }
        
        .progress-bar { background: #374151; height: 12px; border-radius: 6px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.5s; background: var(--accent); }
        .full { background: var(--danger) !important; }

        .reinf-list { font-size: 0.85rem; list-style: none; padding: 0; margin: 5px 0 0 0; color: #d1d5db; }
        .reinf-item { background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; margin-top: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #374151; }
        .modal-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: var(--primary); }
        .modal-text { color: #f3f4f6; margin-bottom: 20px; font-size: 0.95rem; text-align: left; background: #111827; padding: 15px; border-radius: 8px; line-height: 1.5; }
        
        .reset-all { background: none; border: none; color: #4b5563; width: 100%; margin-top: 15px; font-size: 0.75rem; text-decoration: underline; cursor: pointer; }
        .order-item { border-bottom: 1px solid #374151; padding: 5px 0; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h1>NR1 🛡 VIKINGS</h1>
        <a href="https://qegukom-create.github.io/NR1-VIKINGS/position.html" class="btn-config">POSITION ⚙️</a>
    </div>

    <div class="panel">
        <label>BECOME HOST (400k Cap)</label>
        <input type="text" id="h-name" class="search-dynamic" placeholder="✍️ Start typing your pseudo..." list="players-list">
        <button class="btn btn-host" onclick="addHost()">I am Online</button>
    </div>

    <div class="panel">
        <label>REINFORCEMENTS</label>
        <input type="text" id="r-name" class="search-dynamic" placeholder="✍️ Start typing your pseudo..." list="players-list">
        
        <div class="row">
            <div class="flex-input">
                <label>Total Troops</label>
                <input type="number" id="r-qty" placeholder="ex: 400000">
            </div>
            <div class="flex-select">
                <label>Marches</label>
                <select id="r-marches">
                    <option value="4" selected>4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </div>
        </div>
        
        <button class="btn btn-send" onclick="handleAutoBalance()">Dispatch Troops</button>
    </div>

    <datalist id="players-list"></datalist>

    <div id="display"></div>
    
    <!-- Nouveau bouton ajouté ici -->
    <button class="btn btn-forced" onclick="forcedAllOnline()">Forced All Online</button>
    
    <button class="reset-all" onclick="showConfirmModal('Full Reset', 'This will wipe the entire board. Are you sure?', () => hostsRef.remove())">System Reset</button>
</div>

<div id="customModal" class="overlay modal-overlay">
    <div class="modal-content">
        <div id="modalTitle" class="modal-title">Info</div>
        <div id="modalText" class="modal-text"></div>
        <div id="modalButtons" class="modal-buttons"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA8edMWQreJMKrbS8MuowKZl58x7W5vfBU",
        authDomain: "nr1-vikings.firebaseapp.com",
        databaseURL: "https://nr1-vikings-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "nr1-vikings",
        storageBucket: "nr1-vikings.firebasestorage.app",
        messagingSenderId: "1042283854890",
        appId: "1:1042283854890:web:84414b7afed626191ed753"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const hostsRef = db.ref('viking_strategy');
    const MAX_CAP = 400000;
    const SLICE = 100000;

    let allMembers = {};

    function showConfirmModal(title, text, action) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalText').innerText = text;
        const btnContainer = document.getElementById('modalButtons');
        btnContainer.innerHTML = `<button class="btn" style="background:#4b5563; color:white; margin-bottom:5px" onclick="closeModal()">Cancel</button>
                                  <button class="btn" style="background:var(--danger); color:white" id="confirmBtn">Confirm</button>`;
        document.getElementById('confirmBtn').onclick = () => { action(); closeModal(); };
        document.getElementById('customModal').style.display = 'flex';
    }

    function showOrderModal(orders, remaining) {
        document.getElementById('modalTitle').innerText = "🚀 DISPATCH ORDERS";
        let html = "<strong>Instructions (Sorted by closest):</strong><br><br>";
        orders.forEach(o => {
            const distText = o.distance !== null ? ` (<span style="color:var(--accent)">Dist: ${o.distance.toFixed(1)}</span>)` : '';
            html += `<span class="order-item">➡️ Send <b>${(o.qty/1000)}k</b> to 🏰 <b>${o.hostName}</b>${distText}</span>`;
        });
        if(remaining > 0) {
            html += `<br><small style="color:var(--danger)">⚠️ ${remaining.toLocaleString()} troops not sent (Max marches or no other hosts).</small>`;
        }
        document.getElementById('modalText').innerHTML = html;
        document.getElementById('modalButtons').innerHTML = `<button class="btn" style="background:var(--primary); color:white" onclick="closeModal()">Got it!</button>`;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('customModal').style.display = 'none'; }

    function findMemberByName(name) {
        return Object.values(allMembers).find(m => m.name.toLowerCase() === name.toLowerCase());
    }

    function calculateDistance(x1, y1, x2, y2) {
        if (x1 === undefined || y1 === undefined || x2 === undefined || y2 === undefined) return null;
        return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
    }

    db.ref('alliance_database').on('value', snap => {
        allMembers = snap.val() || {};
        const dataList = document.getElementById('players-list');
        let html = '';
        
        Object.keys(allMembers)
            .sort((a,b) => allMembers[a].name.localeCompare(allMembers[b].name))
            .forEach(id => {
                const member = allMembers[id];
                const coordsText = (member.x !== undefined && member.y !== undefined) ? ` [X:${member.x}, Y:${member.y}]` : '';
                const labelName = member.aliases ? `${member.name} (${member.aliases})${coordsText}` : `${member.name}${coordsText}`;
                html += `<option value="${member.name}">${labelName}</option>`;
            });
            
        dataList.innerHTML = html;
    });

    hostsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const display = document.getElementById('display');
        display.innerHTML = "";
        if (!data) return;

        Object.keys(data).forEach(id => {
            const h = data[id];
            let total = 0;
            let list = "";
            if (h.reinforcements) {
                Object.keys(h.reinforcements).forEach(rid => {
                    const r = h.reinforcements[rid];
                    total += r.qty;
                    list += `<div class="reinf-item"><span>${r.name}</span> <span>+${(r.qty/1000)}k <button style="color:var(--danger); border:none; background:none; cursor:pointer;" onclick="hostsRef.child('${id}').child('reinforcements').child('${rid}').remove()">×</button></span></div>`;
                });
            }
            
            const hostProfile = findMemberByName(h.name);
            const coordsDisplay = (hostProfile && hostProfile.x !== undefined) ? `<span class="host-coords">📍 X:${hostProfile.x} Y:${hostProfile.y}</span>` : '';

            const pct = (total / MAX_CAP) * 100;
            display.innerHTML += `<div class="host-card">
                <div class="host-header"><span class="host-name">🏰 ${h.name}${coordsDisplay}</span><button style="border:none; background:none; color:#6b7280; font-size:1.5rem;" onclick="showConfirmModal('Remove Host', 'Remove ${h.name}?', () => hostsRef.child('${id}').remove())">×</button></div>
                <div class="progress-bar"><div class="progress-fill ${pct >= 100 ? 'full' : ''}" style="width:${Math.min(pct, 100)}%"></div></div>
                <div style="font-size:0.8rem; text-align:right; font-weight:bold; color:${pct >= 100 ? 'var(--danger)' : '#9ca3af'}">${total.toLocaleString()} / ${MAX_CAP.toLocaleString()}</div>
                <div class="reinf-list">${list}</div></div>`;
        });
    });

    function addHost() {
        const input = document.getElementById('h-name');
        const value = input.value.trim();
        if (value) { 
            hostsRef.push({ name: value, capacity: MAX_CAP }); 
            input.value = "";
        } else {
            alert("Please type or select a player to become Host.");
        }
    }

    // Nouvelle fonction pour forcer tout le monde en ligne avec mot de passe
    async function forcedAllOnline() {
        const password = prompt("Enter control password:");
        if (password !== "PEWN") {
            return alert("Incorrect password. Access denied.");
        }

        const memberIds = Object.keys(allMembers);
        if (memberIds.length === 0) {
            return alert("No players found in the database.");
        }

        // Récupérer l'état actuel des hosts pour éviter les doublons absolus
        const currentHostsSnap = await hostsRef.once('value');
        const currentHosts = currentHostsSnap.val() || {};
        const currentHostNames = Object.values(currentHosts).map(h => h.name.toLowerCase());

        let addedCount = 0;
        memberIds.forEach(id => {
            const playerName = allMembers[id].name;
            // On vérifie si le joueur n'est pas déjà enregistré comme Host actif
            if (!currentHostNames.includes(playerName.toLowerCase())) {
                hostsRef.push({ name: playerName, capacity: MAX_CAP });
                addedCount++;
            }
        });

        alert(`Success! ${addedCount} players have been forced online.`);
    }

    async function handleAutoBalance() {
        const rName = document.getElementById('r-name').value.trim();
        let qty = parseInt(document.getElementById('r-qty').value);
        let maxMarches = parseInt(document.getElementById('r-marches').value);
        
        if (!rName || isNaN(qty) || qty <= 0) return alert("Type your Name and enter Troops!");

        const snapshot = await hostsRef.once('value');
        const hosts = snapshot.val();
        if (!hosts) return alert("No hosts online!");

        const senderProfile = findMemberByName(rName);

        let hostArray = Object.keys(hosts)
            .map(id => {
                let total = 0;
                if (hosts[id].reinforcements) Object.values(hosts[id].reinforcements).forEach(r => total += r.qty);
                
                const hostProfile = findMemberByName(hosts[id].name);
                let distance = null;
                if (senderProfile && hostProfile) {
                    distance = calculateDistance(senderProfile.x, senderProfile.y, hostProfile.x, hostProfile.y);
                }

                return { id: id, name: hosts[id].name, total: total, distance: distance };
            })
            .filter(h => h.name.toLowerCase() !== rName.toLowerCase());

        if (hostArray.length === 0) return alert("No other hosts available to receive your troops!");

        let myOrders = [];
        let marchCount = 0;

        while (qty > 0 && marchCount < maxMarches) {
            hostArray.sort((a, b) => {
                if (a.total !== b.total) {
                    return a.total - b.total;
                }
                if (a.distance !== null && b.distance !== null) {
                    return a.distance - b.distance; 
                }
                return 0;
            });

            let target = hostArray[0];
            if (target.total >= MAX_CAP) break;

            let toSend = Math.min(qty, SLICE, MAX_CAP - target.total);
            hostsRef.child(target.id).child('reinforcements').push({ name: rName, qty: toSend });
            myOrders.push({ hostName: target.name, qty: toSend, distance: target.distance });
            
            target.total += toSend;
            qty -= toSend;
            marchCount++;
        }

        if (myOrders.length > 0) {
            showOrderModal(myOrders, qty);
            document.getElementById('r-qty').value = "";
            document.getElementById('r-name').value = "";
        } else {
            alert("Remaining hosts are full!");
        }
    }
</script>
</body>
</html>
