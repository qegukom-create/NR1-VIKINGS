<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NR1 - Vikings War Room</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --panel-bg: #16213e;
            --accent: #4ecca3; /* Vert d'eau/Cyan pour le calme */
            --urgent: #e94560; /* Rouge pour l'urgence */
            --stable: #f1c40f; /* Jaune pour la stabilité */
            --empty: #4592af;  /* Bleu pour le début */
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: #e0e0e0; padding: 15px; text-align: center; }
        .container { max-width: 900px; margin: auto; background: var(--panel-bg); padding: 25px; border-radius: 15px; border: 1px solid #30475e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h1 { color: #fff; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 3px; font-weight: 300; }
        h1 span { color: var(--accent); font-weight: 800; }

        .panel { background: #0f3460; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #1a1a2e; }
        input, select { background: #1a1a2e; color: #fff; border: 1px solid #30475e; padding: 10px; border-radius: 5px; margin: 5px; outline: none; }
        input:focus { border-color: var(--accent); }
        
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn-host { background: var(--accent); color: #1a1a2e; }
        .btn-send { background: #fff; color: #1a1a2e; }
        .btn-host:hover, .btn-send:hover { opacity: 0.8; transform: translateY(-2px); }
        
        .suggest-btn { background: transparent; border: 1px solid #555; color: #aaa; font-size: 0.7em; padding: 4px 8px; margin: 2px; border-radius: 3px; cursor: pointer; }
        .suggest-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* GRID & DYNAMIC CARDS */
        .host-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 25px; }
        
        .host-card { 
            background: #1a1a2e; 
            border-radius: 10px; 
            padding: 18px; 
            text-align: left; 
            transition: 0.4s; 
            border-top: 5px solid var(--empty); /* Couleur de bordure par défaut */
        }
        
        .host-name { font-size: 1.2em; font-weight: bold; color: #fff; }
        
        /* Progress Bar */
        .progress-bg { background: #0f3460; height: 10px; border-radius: 5px; overflow: hidden; margin: 15px 0; }
        .progress-fill { height: 100%; transition: width 0.6s ease-in-out; }

        .status-label { font-size: 0.65em; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; margin-bottom: 5px; display: block; }
        
        .delete-btn { float: right; color: #555; cursor: pointer; border: none; background: none; font-size: 1.2em; }
        .delete-btn:hover { color: var(--urgent); }

        .reinforcer-list { font-size: 0.85em; color: #8eaec2; list-style: none; padding: 0; margin-top: 15px; border-top: 1px solid #252545; padding-top: 10px; }
        .reinforcer-item { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .remove-reinf { color: #555; cursor: pointer; transition: 0.2s; }
        .remove-reinf:hover { color: var(--urgent); }

        .btn-reset { background: transparent; color: #444; margin-top: 50px; font-size: 0.7em; border: 1px solid #222; padding: 5px; border-radius: 3px; cursor: pointer; }
        .btn-reset:hover { color: #888; border-color: #444; }
    </style>
</head>
<body>

<div class="container">
    <h1>NR1 <span>VIKINGS</span> WAR ROOM</h1>

    <div class="panel">
        <strong>🏰 REGISTER AS HOST</strong><br>
        <input type="text" id="h-name" placeholder="In-Game Name">
        <input type="number" id="h-capa" placeholder="Max Capacity">
        <button class="btn btn-host" onclick="addHost()">I will be online</button>
    </div>

    <div class="panel">
        <strong>🏹 REINFORCEMENTS</strong><br>
        <input type="text" id="r-name" placeholder="Your Name">
        <input type="number" id="r-qty" placeholder="Troops">
        <div style="margin: 5px 0;">
            <button class="suggest-btn" onclick="applySuggest(0.25)">25%</button>
            <button class="suggest-btn" onclick="applySuggest(0.50)">50%</button>
            <button class="suggest-btn" onclick="applySuggest(1.00)">Fill</button>
        </div>
        <select id="r-target" onchange="syncSelectedSpace()"><option value="">Target Host...</option></select>
        <button class="btn btn-send" onclick="sendReinforce()">Send</button>
    </div>

    <div id="host-display" class="host-grid"></div>
    <button class="btn btn-reset" onclick="resetAll()">Full Reset (Admin)</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA8edMWQreJMKrbS8MuowKZl58x7W5vfBU",
        authDomain: "nr1-vikings.firebaseapp.com",
        databaseURL: "https://nr1-vikings-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "nr1-vikings",
        storageBucket: "nr1-vikings.firebasestorage.app",
        messagingSenderId: "1042283854890",
        appId: "1:1042283854890:web:84414b7afed626191ed753"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const hostsRef = db.ref('viking_strategy');

    let localSpaceCache = {};

    hostsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const display = document.getElementById('host-display');
        const select = document.getElementById('r-target');
        const selectedValue = select.value;
        
        display.innerHTML = "";
        select.innerHTML = '<option value="">Target Host...</option>';
        localSpaceCache = {};
        
        if (data) {
            Object.keys(data).forEach(id => {
                const h = data[id];
                let total = 0;
                let rHTML = "";
                
                if (h.reinforcements) {
                    Object.keys(h.reinforcements).forEach(reinfId => {
                        const r = h.reinforcements[reinfId];
                        total += parseInt(r.qty);
                        rHTML += `<li class="reinforcer-item">
                                    <span>• ${r.name} (+${r.qty.toLocaleString()})</span>
                                    <span class="remove-reinf" onclick="removeReinforcement('${id}', '${reinfId}')">✖</span>
                                  </li>`;
                    });
                }

                let left = h.capacity - total;
                let percent = (total / h.capacity) * 100;
                localSpaceCache[id] = left;

                // LOGIQUE DE COULEUR DYNAMIQUE
                let color = "#4592af"; // Bleu (Vide)
                let statusMsg = "Needs Troops";
                
                if (percent >= 100) { color = "#555"; statusMsg = "Fully Protected"; }
                else if (percent >= 85) { color = "#f1c40f"; statusMsg = "Almost Protected"; }
                else if (percent >= 40) { color = "#4ecca3"; statusMsg = "Stabilized"; }
                else { color = "#e94560"; statusMsg = "CRITICAL / URGENT"; }

                if (total < h.capacity) {
                    let opt = document.createElement("option");
                    opt.value = id;
                    opt.text = `${h.name} (${left.toLocaleString()} left)`;
                    select.add(opt);
                }

                display.innerHTML += `
                    <div class="host-card" style="border-top-color: ${color}">
                        <button class="delete-btn" onclick="removeHost('${id}')">×</button>
                        <span class="status-label" style="color:${color}">${statusMsg}</span>
                        <span class="host-name">🏰 ${h.name}</span>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width:${percent}%; background:${color}"></div>
                        </div>
                        <div style="text-align:right; font-size:0.8em; font-weight:bold; color:${color}">
                            ${total.toLocaleString()} / ${h.capacity.toLocaleString()} (${percent.toFixed(0)}%)
                        </div>
                        <ul class="reinforcer-list">
                            ${rHTML || '<li style="color:#444">Waiting for reinforcements...</li>'}
                        </ul>
                    </div>
                `;
            });
            select.value = selectedValue;
        }
    });

    function applySuggest(ratio) {
        const id = document.getElementById('r-target').value;
        if (!id) return alert("Select a Target Host first!");
        document.getElementById('r-qty').value = Math.floor(localSpaceCache[id] * ratio);
    }

    function addHost() {
        const name = document.getElementById('h-name').value.trim();
        const capa = document.getElementById('h-capa').value;
        if (!name || !capa) return alert("Missing info!");
        hostsRef.push({ name: name, capacity: parseInt(capa), reinforcements: {} });
        document.getElementById('h-name').value = "";
    }

    function removeHost(id) {
        if (prompt("Admin Password:") === "NR1") hostsRef.child(id).remove();
    }

    function removeReinforcement(hostId, reinfId) {
        if (confirm("Cancel this reinforcement?")) {
            hostsRef.child(hostId).child('reinforcements').child(reinfId).remove();
        }
    }

    function sendReinforce() {
        const name = document.getElementById('r-name').value.trim();
        const qty = parseInt(document.getElementById('r-qty').value);
        const targetId = document.getElementById('r-target').value;
        if (!name || isNaN(qty) || !targetId) return alert("Fill all fields!");
        if (qty > localSpaceCache[targetId]) return alert("Over capacity!");

        hostsRef.child(targetId).child('reinforcements').push({ name: name, qty: qty });
        document.getElementById('r-qty').value = "";
    }

    function resetAll() {
        if (prompt("Admin Password:") === "NR1") hostsRef.remove();
    }
</script>
</body>
</html>
